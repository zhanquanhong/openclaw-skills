# 任务类型定义配置
# wbs-skill v4.1
# 修改此文件可新增/变更任务类型，无需修改代码

# 任务类型列表
types:
  - id: "接口任务"
    description: "新增/更新 API，前后端数据交互"
    examples: ["POST查询列表接口", "后端查询用户列表", "提供新建接口"]

  - id: "数据库任务"
    description: "表结构设计、SQL、索引、DDL、数据迁移"
    examples: ["新建备份记录表", "添加索引", "建表语句"]

  - id: "前端任务"
    description: "页面、UI 组件、交互"
    examples: ["前端页面展示备份开关", "按钮交互", "列表展示"]

  - id: "中间件任务"
    description: "消息队列、缓存、Redis、MQ、定时任务"
    examples: ["发送MQ消息", "Redis缓存清理", "配置XXL-Job定时任务"]

  - id: "配置任务"
    description: "参数配置、环境变量、设置"
    examples: ["配置备份开关参数", "设置环境变量", "配置白名单"]

  - id: "运维任务"
    description: "部署、监控、日志、告警、CI/CD"
    examples: ["容器状态监控", "告警通知", "调K8sAPI滚动更新Pod"]

  - id: "架构设计"
    description: "系统架构、模块划分、方案设计"
    examples: ["备份还原架构方案设计", "模块划分"]

  - id: "数据迁移"
    description: "历史数据迁移、数据清洗"
    examples: ["历史数据全量迁移", "数据清洗"]

  - id: "权限/安全"
    description: "RBAC、鉴权、加密"
    examples: ["备份鉴权接口", "权限校验"]

  - id: "功能任务"
    description: "以上均不属于的业务逻辑"
    examples: ["查询备份开关状态", "业务逻辑处理"]

# LLM 分类 + 概括 + 有效性过滤 prompt 模板
llm_prompt: |
  你是一名软件工程任务分析师。请为以下每一条原文做三件事：

  1. 判断是否是一个可执行的任务（valid: true/false）
     - valid=false 的具体场景（必须严格识别）：
       * 时序图/流程图中的简短描述行：通常带反引号、表名、字段名（如"从`表名`查询`字段`"）、无主语、像是代码注释
       * 以 a./b./c./d./①/②/③/◦/- 开头的枚举项说明行：说明性文字，不是独立任务
       * "技术实现描述"/"实现逻辑"/"触发条件"/"业务目标"等纯章节说明行
       * 接口响应示例（alt[xxx]等）
       * 入参/出参描述行
       * 交叉引用（详见xxx、⻅3.等）
       * 需求背景描述（为保障xxx）
       * 架构图标注行（技术名词堆叠）
       * 流程/数据流描述行：描述系统行为而非开发任务（如"返回XX列表"、"查询XX表XX字段"、"作为XX返回"、"支持XX功能"、"从XX表查询XX字段"、"查询基础条件"），特征是描述"系统如何工作"而非"开发要做什么"
       * 接口参数/条件说明行：如"查询基础条件：XXX"、"入参：XXX"、"出参：XXX"、"请求参数"
       * PDF解析噪声/拼接文本：多个短词拼成一行、同一状态词反复出现（如"读取失败文件不存在解析失败查询失败"、"开始 初始化对账任务更新"），无完整语义，非开发任务
       * 孤立状态/结果词：仅剩单个状态描述、无开发动作（如"不存在"、"一致性校验通过"、"校验通过"、"不存在"等仅有成功/失败状态的行）
     - valid=true 的场景：需要开发人员动手实现的开发任务（步骤标题如"第X步"、"第一步"等是有效任务）

  2. 如果 valid=true，判断任务类型（从列出的类型中选择一个）

  3. 如果 valid=true，概括任务内容（用简洁的动宾结构概括，去除冗余信息，保留关键动作和技术细节，20字以内）

  可选的类型（共 {type_count} 种）：
  {type_list}

  返回格式为 JSON，key 为任务序号（字符串），value 为对象：
  {{"1": {{"valid": true, "type": "接口任务", "summary": "新增用户查询接口"}}, "2": {{"valid": false}}, ...}}

  只返回 JSON，不要其他文字。

  任务列表：
  {task_list}

# 回退关键词（LLM 不可用时使用）
fallback_keywords:
  接口任务: ["接口", "API", "POST", "GET", "PUT", "DELETE", "PATCH", "endpoint", "http"]
  数据库任务: ["表", "字段", "索引", "SQL", "数据库", "DDL", "建表", "ALTER", "CREATE TABLE", "DROP"]
  配置任务: ["配置", "设置", "参数", "config", "settings", "环境变量"]
  中间件任务: ["缓存", "Redis", "队列", "RabbitMQ", "Kafka", "MQ", "定时任务", "Cron", "消息", "XXL-Job"]
  前端任务: ["前端", "页面", "UI", "组件", "交互", "样式", "CSS", "Vue", "React"]
  算法任务: ["算法", "模型", "训练", "推理", "embedding", "相似度", "向量"]

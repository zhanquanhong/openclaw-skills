# 章节识别模板配置
# 用于从技术方案文档中自动识别章节结构

templates:
  # 模板 1：数字编号（1.2.1、2.1.3）
  numeric:
    name: "数字编号"
    pattern: "^\\d+(\\.\\d+)+"
    level_infer: "count_dots"
    description: "适用于 1.2.1、2.1.3 等数字编号格式"
    example: "1.2.1 提取模型的文件 ID"

  # 模板 2：中文编号（一、(一)、1.）
  chinese:
    name: "中文编号"
    rules:
      - pattern: "^[一二三四五六七八九十]+[、.]"
        level: 1
        description: "一级标题：一、二、三"
      - pattern: "^\\([一二三四五六七八九十]+\\)[、.]?"
        level: 2
        description: "二级标题：(一)(二)(三)"
      - pattern: "^\\d+[、.]"
        level: 3
        description: "三级标题：1. 2. 3."
    description: "适用于一、(一)、1. 等中文编号格式"
    example: "一、需求分析 → (一) 功能需求 → 1. 用户管理"

  # 模板 3：Markdown 标题（#、##、###）
  markdown:
    name: "Markdown 标题"
    pattern: "^(#{1,6})\\s+(.+)"
    level_infer: "hash_count"
    description: "适用于 # 标题、## 二级标题、### 三级标题"
    example: "## 接口定义\n### 1.2.1 用户查询"

  # 模板 4：混合编号（中文 + 数字）
  mixed:
    name: "混合编号"
    rules:
      - pattern: "^[一二三四五六七八九十]+[、.]"
        level: 1
        description: "一级标题：一、二、三"
      - pattern: "^\\d+\\.\\d+"
        level: 2
        description: "二级标题：1.1、1.2"
    description: "适用于中文一级 + 数字二级的混合编号"
    example: "一、需求分析\n1.1 功能需求"

# 默认使用的模板
default_template: numeric
